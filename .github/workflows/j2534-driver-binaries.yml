name: J2534 driver binaries (Linux)

# Windows is built by the "Firmware and J2534 driver" workflow (Docker, MinGW).
# This workflow builds the Linux driver libraries (x86_64, armhf, arm64) in Docker.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j2534-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux driver (x86_64, armhf, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build and test in Docker
        run: |
          docker build -f j2534_driver/Dockerfile.unix --target export \
            --output type=local,dest=build/j2534-dist/unix .

      - name: Verify packages
        run: |
          for dir in build/j2534-dist/unix/*/; do
            (cd "$dir" && sha256sum --check SHA256SUMS)
          done

      - name: Upload Linux drivers
        uses: actions/upload-artifact@v7
        with:
          name: opendiag-j2534-linux
          path: build/j2534-dist/unix/
          if-no-files-found: error
          retention-days: 30
