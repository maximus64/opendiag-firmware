name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main, dev]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  # Also dispatched by firmware.yml after a release, so the update page serves the new firmware.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install MkDocs
        # MkDocs 2.0 drops the plugin and theme system Material depends on.
        run: pip install "mkdocs<2" mkdocs-material mkdocs-github-admonitions-plugin

      # --strict turns broken links and missing files into failures, so a PR catches them.
      - name: Build
        run: mkdocs build --strict -d site

      # The update page reads firmware/boards.json and firmware/<board>/. A release that predates
      # per-board ZIPs has only opendiag-firmware.zip. That image is OpenDIAG hardware v1: the v1.0.3
      # source has main/pinout.h and no boards/ directory, and the ZIP does not name a board. It is
      # mapped to opendiag_hw_v1 only when the release has no per-board ZIP for that board.
      # Each release ZIP's manifest.json is already in ESP Web Tools format, so it is unpacked as-is.
      - name: Add latest firmware release to the update page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          packages_dir=$(mktemp -d)
          trap 'rm -rf -- "$packages_dir"' EXIT
          gh release download --pattern 'opendiag-firmware*.zip' --dir "$packages_dir"
          shopt -s nullglob
          packages=("$packages_dir"/opendiag-firmware-*.zip)
          if (( ${#packages[@]} == 0 )); then
            packages=("$packages_dir"/opendiag-firmware.zip)
          fi
          if [[ ! -f "${packages[0]}" ]]; then
            echo "The latest release has no firmware ZIP" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if [[ $(basename "$package") == opendiag-firmware.zip ]]; then
              board=opendiag_hw_v1
            else
              board=$(basename "$package" .zip)
              board=${board#opendiag-firmware-}
            fi
            mkdir -p "site/update/firmware/$board"
            unzip "$package" -d "site/update/firmware/$board"
            (cd "site/update/firmware/$board" && sha256sum --check SHA256SUMS)
          done

      # boards.json is the board list the update page offers. A release ZIP for a board that is not
      # in boards/ fails the build. A board with no ZIP in the latest release is left off the list,
      # but the default board must have one. "default" comes from each board.json. The default entry
      # is listed first, then the rest in board id order. The update page starts on the first entry.
      - name: Write the update page board list
        run: |
          python3 -I - site/update/firmware <<'PY'
          import json
          import sys
          from pathlib import Path
          firmware = Path(sys.argv[1])
          published = {path.name for path in firmware.iterdir() if path.is_dir()}
          boards = {
              path.parent.name: json.loads(path.read_text())
              for path in Path("boards").glob("*/board.json")
          }
          unknown = sorted(published - set(boards))
          if unknown:
              raise SystemExit(f"Release ZIPs without a board in boards/: {unknown}")
          listed = {board: info for board, info in boards.items() if board in published}
          if not listed:
              raise SystemExit("The latest release has no ZIP for any board in boards/")
          defaults = sorted(board for board, info in boards.items() if info["default"] is True)
          if len(defaults) != 1:
              raise SystemExit(f"Exactly one board.json must have \"default\": true, found {defaults}")
          if defaults[0] not in listed:
              raise SystemExit(f"The default board {defaults[0]} has no ZIP in the latest release")
          entries = [
              {
                  "name": info["name"],
                  "default": info["default"],
                  "manifest": f"firmware/{board}/manifest.json",
              }
              for board, info in sorted(listed.items(), key=lambda item: (not item[1]["default"], item[0]))
          ]
          (firmware / "boards.json").write_text(json.dumps(entries, indent=2) + "\n")
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
