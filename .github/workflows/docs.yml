name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "tools/site_board_list.py", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main, dev]
    paths: ["docs/**", "mkdocs.yml", "tools/site_board_list.py", ".github/workflows/docs.yml"]
  # Also dispatched by firmware.yml after a release, so the update page serves the new firmware.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Zensical
        # Zensical is pre-1.0, so a new minor version must not reach the published site untested.
        run: pip install "zensical~=0.1.1"

      # --strict turns broken links and missing files into failures, so a PR catches them.
      # The site is written to site_dir from mkdocs.yml: build/github-site.
      - name: Build
        run: zensical build --strict

      # The update page reads firmware/boards.json and firmware/<board>/. A release that predates
      # per-board ZIPs has only opendiag-firmware.zip. That image is OpenDIAG hardware v1: the v1.0.3
      # source has main/pinout.h and no boards/ directory, and the ZIP does not name a board. It is
      # mapped to opendiag only when the release has no per-board ZIP for that board.
      # Each release ZIP's manifest.json is already in ESP Web Tools format, so it is unpacked as-is.
      - name: Add latest firmware release to the update page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          packages_dir=$(mktemp -d)
          trap 'rm -rf -- "$packages_dir"' EXIT
          gh release download --pattern 'opendiag-firmware*.zip' --dir "$packages_dir"
          shopt -s nullglob
          packages=("$packages_dir"/opendiag-firmware-*.zip)
          if (( ${#packages[@]} == 0 )); then
            packages=("$packages_dir"/opendiag-firmware.zip)
          fi
          if [[ ! -f "${packages[0]}" ]]; then
            echo "The latest release has no firmware ZIP" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if [[ $(basename "$package") == opendiag-firmware.zip ]]; then
              board=opendiag
            else
              board=$(basename "$package" .zip)
              board=${board#opendiag-firmware-}
            fi
            mkdir -p "build/github-site/update/firmware/$board"
            unzip "$package" -d "build/github-site/update/firmware/$board"
            (cd "build/github-site/update/firmware/$board" && sha256sum --check SHA256SUMS)
          done

      # boards.json is the board list the update page offers. A board with no ZIP in the latest
      # release is left off the list. tools/build_site.py writes it the same way for a local build.
      - name: Write the update page board list
        run: python3 -I tools/site_board_list.py build/github-site/update/firmware

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/github-site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
