name: Firmware

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build reproducible ESP32-S3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Test, build, and verify reproducibility
        run: |
          mkdir -p build/docker
          docker compose --progress plain run --rm --build -T firmware --verify

      - name: Verify firmware package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          verification_dir=$(mktemp -d)
          trap 'rm -rf -- "$verification_dir"' EXIT
          unzip build/docker/opendiag-firmware.zip -d "$verification_dir"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)
          python3 - "$verification_dir/manifest.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          version = json.loads(Path(sys.argv[1]).read_text())["version"]
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag and version != release_tag:
              raise SystemExit(f"Firmware version {version!r} does not match the release tag")
          PY

      - name: Upload firmware package
        uses: actions/upload-artifact@v7
        with:
          path: build/docker/opendiag-firmware.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified firmware package
        uses: actions/download-artifact@v8
        with:
          name: opendiag-firmware.zip
          path: dist
          skip-decompress: true

      - name: Verify release package
        run: |
          verification_dir=$(mktemp -d)
          trap 'rm -rf -- "$verification_dir"' EXIT
          unzip dist/opendiag-firmware.zip -d "$verification_dir"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/opendiag-firmware.zip \
            "${release_flags[@]}"
