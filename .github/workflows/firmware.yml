name: Firmware and J2534 driver

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boards:
    name: List firmware boards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # A board is a boards/<id>/ directory with a pinout.h. Each one needs a board.json with a
      # string "name" and a boolean "default", and exactly one board may be the default. The optional
      # "maintainers" list must match the board's line in .github/CODEOWNERS.
      - name: Read the board matrix
        id: matrix
        run: |
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          boards = sorted(path.parent.name for path in Path("boards").glob("*/pinout.h"))
          if not boards:
              raise SystemExit("No board directory with a pinout.h was found in boards/")

          defaults = []
          for board in boards:
              manifest = Path("boards", board, "board.json")
              if not manifest.is_file():
                  raise SystemExit(f"boards/{board}/board.json is missing")
              try:
                  info = json.loads(manifest.read_text())
              except json.JSONDecodeError as error:
                  raise SystemExit(f"boards/{board}/board.json is not valid JSON: {error}")
              if not isinstance(info, dict):
                  raise SystemExit(f"boards/{board}/board.json must be a JSON object")
              if not isinstance(info.get("name"), str) or not info["name"]:
                  raise SystemExit(f'boards/{board}/board.json needs a non-empty string "name"')
              if type(info.get("default")) is not bool:
                  raise SystemExit(f'boards/{board}/board.json needs a boolean "default"')
              if info["default"]:
                  defaults.append(board)

          if len(defaults) != 1:
              raise SystemExit(
                  f'Exactly one board.json may have "default": true, found {len(defaults)}: {defaults}'
              )

          # "maintainers" may be empty or absent (a board nobody maintains any more), but then the
          # board must have no CODEOWNERS line either, so review requests never go to a stale owner.
          owners = {}
          for line in Path(".github/CODEOWNERS").read_text().splitlines():
              fields = line.split("#", 1)[0].split()
              if not fields:
                  continue
              parts = fields[0].strip("/").split("/")
              if len(parts) == 2 and parts[0] == "boards":
                  owners[parts[1]] = {owner.lower() for owner in fields[1:]}
          unknown = sorted(set(owners) - set(boards))
          if unknown:
              raise SystemExit(f".github/CODEOWNERS lists boards that do not exist: {unknown}")
          for board in boards:
              info = json.loads(Path("boards", board, "board.json").read_text())
              maintainers = info.get("maintainers", [])
              if not isinstance(maintainers, list) or not all(
                  isinstance(m, dict) and isinstance(m.get("github"), str) and m["github"]
                  for m in maintainers
              ):
                  raise SystemExit(f'boards/{board}/board.json "maintainers" needs entries with a "github" string')
              expected = {"@" + m["github"].lower() for m in maintainers}
              if owners.get(board, set()) != expected:
                  raise SystemExit(
                      f"boards/{board}: .github/CODEOWNERS has {sorted(owners.get(board, set()))} "
                      f"but board.json maintainers give {sorted(expected)}"
                  )

          entries = [
              {"board": board, "name": json.loads(Path("boards", board, "board.json").read_text())["name"]}
              for board in boards
          ]
          matrix = json.dumps({"include": entries})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={matrix}\n")
          PY

  build:
    name: Build ${{ matrix.name }} firmware
    needs: [boards]
    strategy:
      matrix: ${{ fromJSON(needs.boards.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-24.04
    # A board job builds twice under --verify, so it needs more time than the other jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Test, build, and verify reproducibility
        run: |
          mkdir -p build/docker
          docker compose --progress plain run --rm --build -T firmware --verify --board "${{ matrix.board }}"

      - name: Verify firmware package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PACKAGE: build/docker/opendiag-firmware-${{ matrix.board }}.zip
        run: |
          if [[ ! -f "$PACKAGE" ]]; then
            echo "No $PACKAGE was produced" >&2
            exit 1
          fi
          verification_root=$(mktemp -d)
          trap 'rm -rf -- "$verification_root"' EXIT
          verification_dir="$verification_root/$(basename "$PACKAGE" .zip)"
          unzip "$PACKAGE" -d "$verification_dir"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)
          python3 -I - "$verification_dir/manifest.json" "$PACKAGE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          version = json.loads(Path(sys.argv[1]).read_text())["version"]
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag and version != release_tag:
              raise SystemExit(f"{sys.argv[2]}: firmware version {version!r} does not match the release tag")
          PY

      # archive: false uploads the ZIP as the artifact itself, so download-artifact returns it as a file.
      - name: Upload firmware package
        uses: actions/upload-artifact@v7
        with:
          name: opendiag-firmware-${{ matrix.board }}.zip
          path: build/docker/opendiag-firmware-${{ matrix.board }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  j2534-windows:
    name: Test and build J2534 driver (Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Test and build driver package
        run: |
          mkdir -p build/docker
          docker compose --progress plain run --rm --build -T j2534-driver

      - name: Verify driver package
        run: |
          verification_dir=$(mktemp -d)
          trap 'rm -rf -- "$verification_dir"' EXIT
          unzip build/docker/opendiag-j2534-driver-windows-x86.zip -d "$verification_dir"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)

      - name: Upload driver package
        uses: actions/upload-artifact@v7
        with:
          name: opendiag-j2534-driver-windows-x86.zip
          path: build/docker/opendiag-j2534-driver-windows-x86.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Linux driver libraries for x64, armhf and arm64, built in Docker. Each architecture is zipped
  # separately, like the Windows package, so each one can be downloaded and released on its own.
  j2534-linux:
    name: Test and build J2534 driver (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build and test in Docker
        run: |
          docker build -f j2534_driver/Dockerfile.unix --target export \
            --output type=local,dest=build/j2534-dist/unix .

      # The export directories are named by the Docker target (x86_64); the release names use x64.
      # Each package is already a ZIP from package_unix.sh, so it is only renamed into place.
      - name: Collect each architecture's ZIP
        run: |
          for pair in x64:x86_64 armhf:armhf arm64:arm64; do
            name=${pair%%:*}
            arch=${pair##*:}
            cp "build/j2534-dist/unix/linux-$arch/opendiag-j2534-linux-$arch.zip" "build/j2534-dist/opendiag-j2534-driver-linux-$name.zip"
          done

      - name: Verify driver packages
        run: |
          shopt -s nullglob
          verification_root=$(mktemp -d)
          trap 'rm -rf -- "$verification_root"' EXIT
          packages=(build/j2534-dist/opendiag-j2534-driver-linux-*.zip)
          if (( ${#packages[@]} != 3 )); then
            echo "Expected three Linux driver zips, found ${#packages[@]}" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            verification_dir="$verification_root/$(basename "$package" .zip)"
            unzip "$package" -d "$verification_dir"
            (cd "$verification_dir" && sha256sum --check SHA256SUMS)
          done

      - name: Upload x64 driver package
        uses: actions/upload-artifact@v7
        with:
          name: opendiag-j2534-driver-linux-x64.zip
          path: build/j2534-dist/opendiag-j2534-driver-linux-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload armhf driver package
        uses: actions/upload-artifact@v7
        with:
          name: opendiag-j2534-driver-linux-armhf.zip
          path: build/j2534-dist/opendiag-j2534-driver-linux-armhf.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64 driver package
        uses: actions/upload-artifact@v7
        with:
          name: opendiag-j2534-driver-linux-arm64.zip
          path: build/j2534-dist/opendiag-j2534-driver-linux-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Host tests and line coverage for main/ (host suite) and for the host-testable driver
  # sources. Coverage is reported only; no threshold fails the job. Packages come from the
  # Ubuntu 24.04 archive (unpinned, as the runner image moves them). GCC 14 and its gcov are
  # pinned, because line counts differ between GCC majors; gcovr is pinned to 7.0.
  coverage:
    name: Host tests and line coverage
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build protobuf-compiler python3 python3-protobuf python3-venv \
            gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-14 140
          python3 -m venv --system-site-packages "$RUNNER_TEMP/gcovr-venv"
          "$RUNNER_TEMP/gcovr-venv/bin/pip" install gcovr==7.0
          echo "$RUNNER_TEMP/gcovr-venv/bin" >> "$GITHUB_PATH"

      - name: Coverage of main/ (host suite)
        run: |
          gcov --version | head -n 1
          cmake -S test/host -B build/coverage-host -G Ninja -DCOVERAGE=ON
          cmake --build build/coverage-host
          ctest --test-dir build/coverage-host --output-on-failure
          # Reports main/ only; prints the total line coverage.
          cmake --build build/coverage-host --target coverage

      - name: Coverage of j2534_driver/ (driver, common, legacy, platform, config)
        run: |
          make -C j2534_driver test COVERAGE=1
          cd j2534_driver
          gcovr --root . --print-summary --gcov-executable gcov-14 \
            --filter 'driver/' --filter 'common/' --filter 'legacy/' \
            --filter 'platform/' --filter 'config/' \
            build/linux/release

  release:
    name: Publish GitHub Release
    needs: [build, j2534-windows, j2534-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      # Each board's ZIP is its own artifact. It is not decompressed, so every ZIP lands in dist/ as a file.
      - name: Download verified firmware packages
        uses: actions/download-artifact@v8
        with:
          pattern: opendiag-firmware-*.zip
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Download verified driver packages
        uses: actions/download-artifact@v8
        with:
          pattern: opendiag-j2534-driver-*.zip
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Verify release packages
        run: |
          shopt -s nullglob
          firmware_packages=(dist/opendiag-firmware-*.zip)
          if (( ${#firmware_packages[@]} == 0 )); then
            echo "No opendiag-firmware-<board>.zip found in dist/" >&2
            exit 1
          fi
          verification_root=$(mktemp -d)
          trap 'rm -rf -- "$verification_root"' EXIT
          j2534_driver_packages=(dist/opendiag-j2534-driver-*.zip)
          if (( ${#j2534_driver_packages[@]} == 0 )); then
            echo "No opendiag-j2534-driver-<os>-<arch>.zip found in dist/" >&2
            exit 1
          fi
          for package in "${firmware_packages[@]}" "${j2534_driver_packages[@]}"; do
            verification_dir="$verification_root/$(basename "$package" .zip)"
            unzip "$package" -d "$verification_dir"
            (cd "$verification_dir" && sha256sum --check SHA256SUMS)
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          firmware_packages=(dist/opendiag-firmware-*.zip)
          if (( ${#firmware_packages[@]} == 0 )); then
            echo "No opendiag-firmware-<board>.zip found in dist/" >&2
            exit 1
          fi
          j2534_driver_packages=(dist/opendiag-j2534-driver-*.zip)
          if (( ${#j2534_driver_packages[@]} == 0 )); then
            echo "No opendiag-j2534-driver-<os>-<arch>.zip found in dist/" >&2
            exit 1
          fi
          release_flags=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "${firmware_packages[@]}" \
            "${j2534_driver_packages[@]}" \
            "${release_flags[@]}"

      # A release made with GITHUB_TOKEN does not trigger other workflows, so ask for the docs
      # rebuild explicitly. It runs on main, which the github-pages environment allows to deploy.
      - name: Republish the firmware update page
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main