name: Firmware

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure host tests
        run: cmake -S test/host -B build/host

      - name: Build host tests
        run: cmake --build build/host --parallel 2

      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure --timeout 30

  build:
    name: ESP32-S3 firmware package
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build firmware package
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: idf.py firmware-package

      - name: Verify release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path("build/firmware/manifest.json").read_text())["version"]
          if version != os.environ["RELEASE_TAG"]:
              raise SystemExit(f"Firmware version {version!r} does not match the release tag")
          PY

      - name: Verify package checksums
        working-directory: build/firmware
        run: sha256sum --check SHA256SUMS

      - name: Verify package archive
        run: unzip -t build/opendiag-firmware.zip

      - name: Upload firmware package
        uses: actions/upload-artifact@v7
        with:
          path: build/opendiag-firmware.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified firmware package
        uses: actions/download-artifact@v8
        with:
          name: opendiag-firmware.zip
          path: dist
          skip-decompress: true

      - name: Verify release files
        run: |
          unzip dist/opendiag-firmware.zip -d dist/firmware
          cd dist/firmware
          sha256sum --check SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/opendiag-firmware.zip \
            dist/firmware/bootloader.bin \
            dist/firmware/partition-table.bin \
            dist/firmware/opendiag.bin \
            dist/firmware/manifest.json \
            dist/firmware/SHA256SUMS \
            "${release_flags[@]}"
