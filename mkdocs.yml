site_name: OpenDIAG
site_url: https://maximus64.github.io/opendiag-firmware/
repo_url: https://github.com/maximus64/opendiag-firmware
edit_uri: edit/main/docs/

# Read by Zensical, which builds a Material for MkDocs project from its mkdocs.yml unchanged.
docs_dir: docs
# Zensical takes the output directory from here only. docs.yml and tools/build_site.py add the
# firmware under it.
site_dir: build/github-site
nav:
  - Home: index.md
  - User manual: manual.md
  - ELM327 commands: at_commands.md
  - Developer guide: developers.md
  - Firmware update: update/index.html

theme:
  name: material
  variant: classic         # the Material look; Zensical's default header hides the white logo
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.instant
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

extra_css:
  - assets/extra.css

plugins:
  - search
  - gh-admonitions        # renders the manual's > [!WARNING] boxes

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.highlight
