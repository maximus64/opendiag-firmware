# OpenDIAG driver settings for Linux. The Windows template is opendiag.ini; this file is
# packaged for Linux only.
#
# COM is a serial device path on Linux, not a Windows port name such as COM3. Find the device
# with `ls /dev/serial/by-id/` (the stable name) or `ls /dev/ttyACM*`, then set COM to it.
# Use the diagnostic data port, not the debug console port. The data port is USB ID 1209:d1a6
# interface 00 ("OpenDIAG Diagnostic Data Port"); the debug console is interface 02.
#
# Copy this file to /etc/opendiag/opendiag.ini, or set OPENDIAG_DRIVER_CONFIG to its full path.

[device]
Name=OpenDIAG
Transport=com
Host=127.0.0.1
Port=23200
COM=/dev/ttyACM0
Baud=115200
RpcTimeout=8000

[logging]
Enabled=0
MaxFileKB=4096
